# Required gates on every pull request and on pushes to main, phase and
# feature branches. Runs the same init.sh developers and agents run locally.
# Stack presets replace this file with one that sets up their toolchain.
name: CI

on:
  pull_request:
  push:
    branches: [main, "phase/**", "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The harness scripts need node, whatever the application language.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Required and integration gates
        timeout-minutes: 25
        env:
          RUN_INTEGRATION: "1"
        run: bash init.sh
